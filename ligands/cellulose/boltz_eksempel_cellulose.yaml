name: lpmo_cellulose_trimer
chains:
  - protein:
      id: A
      fasta: lpmo.fasta

  - ligand:
      id: B
      ccd: BGC
  - ligand:
      id: C
      ccd: BGC
  - ligand:
      id: D
      ccd: BGC

  - ligand:
      id: E
      ccd: CU

constraints:
  - bond: [B, 1, C1, C, 1, O4] # Binder glukoseneenhetene sammen til oligo
  - bond: [C, 1, C1, D, 1, O4] # --||--

  - bond: [A, 1, ND1, E, 1, CU] # Denne delen er for å fiksere hvor kobberet binder
  - bond: [A, 1, NE2, E, 1, CU] # --||--
