[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structure-pipeline"
version = "0.1.0"
description = "Multi-model structure prediction pipeline for AF3, Boltz-2, and RF3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Eirik", email = "eirik.sorhus@nmbu.com" }
]
dependencies = [
    "typer[all]>=0.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
structure-pipeline = "structure_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/structure_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
