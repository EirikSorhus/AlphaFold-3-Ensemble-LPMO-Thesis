# ──────────────────────────────────────────────────────────
# LPMO Pipeline — Global defaults (v2.1)
# ──────────────────────────────────────────────────────────

pipeline_version: "2.1"

# ── Chain normalisation ──
chain_schema:
  protein: "A"
  glycans: ["B", "C", "D"]
  metal: "E"

# ── Confidence policy ──
confidence:
  atom_level_field: "_atom_site.B_iso_or_equiv"   # all models
  residue_level_field: "_ma_qa_metric_local"        # AF3 only
  derive_residue_from_biso: true                    # median B_iso if field missing

# ── Cross-model atom mapping ──
atom_mapping:
  key: ["element", "residue_ccd", "local_bond_graph", "3D_proximity"]
  proximity_threshold_a: 0.5     # max Å deviation for 3D match
  routine_output: "normalize_report.json"
  debug_outputs: ["atom_map.tsv", "rename_log.json"]
  write_debug_outputs_on: ["atom_mapping_incomplete", "ccd_validation_failed"]

# ── Connectivity requirements ──
connectivity:
  require_chem_comp_bond: true   # complete _chem_comp_bond for all comp_id
  require_struct_conn: true      # _struct_conn for glycosidic + Cu-coord

# PLACER: removed from pipeline (2026-04-21)

# ── Protonation / export ──
protonation:
  reduce_flags: ["-HIS"]         # prioritise Cu-coordinating His
  export_formats:
    posebusters: "pdb"           # with CONECT
    prolif: "mol2"               # bond orders + Gasteiger charges
    analysis: "pdb"              # full-H complex

# ── CCD monosaccharide whitelist (Privateer prep) ──
ccd_monosaccharides:
  - NAG    # N-acetyl-D-glucosamine (chitin)
  - BGC    # beta-D-glucose (cellulose)
  - GLC    # D-glucose
  - MAN    # D-mannose
  - GAL    # D-galactose
  - XYS    # D-xylose
  - ARA    # L-arabinose
  - FUC    # L-fucose
  - SIA    # neuraminic acid
  - GLA    # D-glucuronic acid
  - GAC    # N-acetyl-D-galactosamine

# ── Analysis defaults ──
analysis:
  pre_qc_active_site_max_a: 10.0
  cu_c_proximity_flag_a: 7.0     # flag Cu-C > 7 Å
  crystal_ifp_similarity_soft: 0.3
  c1_vs_c4_offset_a: 0.5        # C1-like if Cu-C1 < Cu-C4 + offset

# ── Target naming helpers ──
# Used when production discovery parses ligand ids like NAG4 / STA6.
target_metadata:
  substrate_by_prefix:
    NAG: chitin
    CEL: cellulose
    BGC: cellulose
    STA: amylose
    GLC: amylose
