# ──────────────────────────────────────────────────────────
# Boltz-2 tuning parameter grid
# ──────────────────────────────────────────────────────────

model: Boltz2

# Fixed Boltz2 flags (never tuned)
fixed:
  use_potentials: false
  step_scale: 1.638

# ── Phase 1: Refinement — recycling_steps ──
refinement_1:
  vary:
    recycling_steps: [3, 6, 10]
  hold:
    diffusion_samples: 5
    sampling_steps: 200

# ── Phase 2: Refinement — sampling_steps ──
refinement_2:
  vary:
    sampling_steps: [200, 400, 600]
  hold:
    recycling_steps: null       # from phase 1
    diffusion_samples: 5

# ── Phase 3: Diversity ──
diversity:
  vary:
    diffusion_samples: [3, 10, 15]
  hold:
    recycling_steps: null       # from phase 1
    sampling_steps: null         # from phase 2

tuning_dataset: "data/tuning_subset.yaml"

metrics:
  - posebusters_pass_rate
  - privateer_pass_rate
  - hdbscan_outlier_rate
  - hdbscan_n_clusters
  - cluster_occupancy_std
  - crystal_ifp_mean_similarity
  - crystal_pocket_rmsd_mean

decision:
  primary: posebusters_pass_rate
  secondary: hdbscan_outlier_rate
  tertiary: cluster_occupancy_std
  sanity: crystal_ifp_mean_similarity
