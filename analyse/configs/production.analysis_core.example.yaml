# Example production config for the current analysis-core slice.
#
# Current scope:
# - discovery from structure_pipeline work/
# - normalization
# - hard QC
# - downstream geometry -> pose_geometry.tsv
# - ProLIF IFP generation and residue contacts
# - convergence metrics
# - condition-wise clustering and cluster signatures
# - crystal anchoring, including all retained medoids and hard-QC-passing
#   top-level AF3 model fallback for no-cluster conditions
# - metrics.csv / summary.json / report.html
#
# Shared external tool paths and bundled config/schema references are resolved
# separately through configs/runtime_paths.yaml.

pipeline_version: "2.1"

production:
  # Select which AF3 construct tree to discover from.
  construct_type: "domain_only"

  # Absolute paths to the future structure_pipeline AF3 output roots.
  # The loader picks the entry matching construct_type and falls back to
  # production.work_root only if no keyed path is present.
  work_roots:
    domain_only: "/cluster/work/projects/nn1003k/eirik/Masteroppgave_clean/structure_pipeline/work_core"
    full_length: "/cluster/work/projects/nn1003k/eirik/Masteroppgave_clean/structure_pipeline/work_full_length"

  # Optional identifier written into the generated artifacts.
  run_id: "analysis_core_example"

  # Discovery controls.
  af3_only: true
  latest_only: true

  # include_targets omitted on purpose to include all available ligands/targets.

  # Stage 6 clustering uses condition-local IFP columns filtered to this main
  # interaction policy. Full raw IFP matrices are still written for audit and
  # descriptive signatures.
  clustering:
    minimum_clusterable_n: 5
    insufficient_clusterable_signal_label: "insufficient_clusterable_signal"
    hdbscan_min_cluster_size: 5
    hdbscan_min_samples: null
    hdbscan_cluster_selection_method: "eom"
    agglomerative_linkage: "average"
    agglomerative_distance_threshold: 0.55
    agglomerative_min_cluster_size: 5

  clustering_features:
    main_include_interaction_types:
      - ImplicitHBAcceptor
      - ImplicitHBDonor
    extra_include_interaction_types: []
    excluded_interaction_types:
      - VdWContact

  # Optional Stage 14 postprocess. When enabled, the main analysis writes
  # 10_predictive/ directly from the just-produced condition_table.tsv.
  predictive:
    enabled: true
    protein_metadata_path: "/cluster/work/projects/nn1003k/eirik/Masteroppgave_clean/analyse/input_data/metadata_final_ec_fixed.tsv"
    task: "all"
    n_folds: 5
    random_state: 42
