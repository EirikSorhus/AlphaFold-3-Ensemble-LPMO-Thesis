revision_update_2026_05_21_locked_predictors:
  purpose: >
    Lock a compact predictor set for substrate-activity prediction under small
    effective n. Effective n is the number of proteins, not the number of
    protein-substrate-dp rows, so each model must use no more than 8 prediction
    variables.
  models:
    - cellulose_active_vs_not_cellulose
    - chitin_active_vs_not_chitin
    - starch_active_vs_not_starch
  data_restriction:
    cellulose_model: use only protein_id__cellulose rows
    chitin_model: use only protein_id__chitin rows
    starch_model: use only protein_id__starch rows
  model_type:
    algorithm: logistic_regression
    penalty: l2
    class_weight: balanced
  evaluation:
    cv: grouped_5_fold_cv_by_protein_id
    report:
      - n_positive
      - n_negative
      - PR_AUC
      - balanced_accuracy
      - Recall_at_k
  caution:
    - small_dataset
    - imbalanced_classes
    - uncertain_negative_annotations
    - very_few_starch_positive_proteins

locked_predictors:
  maximum_predictor_count: 8
  predictors:
    - predictor_name: contact_eligible_fraction
      source_column: contact_eligible_fraction
      row_formula: contact_eligible_fraction
      reason: pre-clustering usable binding signal

    - predictor_name: noise_fraction
      source_column: noise_fraction
      row_formula: noise_fraction
      reason: fraction of clustered signal remaining as noise

    - predictor_name: top_cluster_occupancy
      source_column: top_cluster_occupancy
      row_formula: top_cluster_occupancy
      reason: dominant binding-mode strength

    - predictor_name: hbond_contact_fraction
      source_column: hbond_contact_fraction
      row_formula: hbond_contact_fraction
      reason: polar contact chemistry

    - predictor_name: aromatic_contact_fraction
      source_column: aromatic_contact_fraction
      row_formula: aromatic_contact_fraction
      reason: stacking-like carbohydrate contact chemistry

    - predictor_name: median_n_non_vdw_interactions
      source_column: median_n_non_vdw_interactions
      row_formula: median_n_non_vdw_interactions
      reason: amount of non-vdW contact signal

    - predictor_name: occupancy_weighted_any_plausibility
      source_columns:
        - occupancy_weighted_c1_plausible_fraction
        - occupancy_weighted_c4_plausible_fraction
      row_formula: >
        max(occupancy_weighted_c1_plausible_fraction,
            occupancy_weighted_c4_plausible_fraction)
      reason: total geometry plausibility regardless of regio direction

    - predictor_name: occupancy_weighted_C1_minus_C4_plausibility
      source_columns:
        - occupancy_weighted_c1_plausible_fraction
        - occupancy_weighted_c4_plausible_fraction
      row_formula: >
        occupancy_weighted_c1_plausible_fraction -
        occupancy_weighted_c4_plausible_fraction
      reason: retained regio-bias signal that may still carry substrate information

interpretation_note:
  statement: >
    The substrate analysis tests whether AF3-derived summary features contain
    recoverable signal associated with substrate activity. It is not a final
    biochemical activity model.