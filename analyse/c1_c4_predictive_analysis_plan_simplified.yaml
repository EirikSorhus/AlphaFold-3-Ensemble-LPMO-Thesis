analysis:
  name: c1_c4_predictive_analysis_locked_small_n
  version: 1.0
  status: locked_predictor_set_for_small_effective_n
  revision_date: 2026-05-21
  prolif_runtime_note_2026_05_22: >
    ProLIF-derived H-bond predictors now refer to implicit H-bond interactions
    (ImplicitHBAcceptor and ImplicitHBDonor). Hydrophobic interaction
    predictors are excluded.

purpose:
  objective: >
    Test whether AF3-derived summary features contain recoverable signal for
    experimental C1 and C4 activity.
  interpretation: >
    This is an exploratory signal-detection analysis, not a final biochemical
    activity model.
  caution:
    - small dataset
    - imbalanced classes
    - uncertain negative annotations
    - effective_n_is_number_of_proteins_not_number_of_rows

design_constraints:
  effective_n_definition: protein_id
  predictor_limit_rule: >
    No model may use more than 8 prediction variables because effective n is the
    number of proteins.
  construct_rule: >
    Use one construct per protein. Prefer domain_only. If domain_only is absent,
    use catalytic_domain.

modeling_rows:
  input_table: 09_descriptive/condition_table.tsv
  source_row_unit: protein_id__construct_type__substrate_class__dp
  modeling_row_unit: protein_id__substrate_class
  grouping_unit_for_cv: protein_id
  aggregation_rule: >
    After construct filtering, aggregate the three dp rows within each
    protein_id__substrate_class block using arithmetic mean across available DP4,
    DP6, and DP8 rows. Do not aggregate across substrate_class.
  required_metadata_columns:
    - protein_id
    - construct_type
    - substrate_class
    - dp
    - experimental_regio_label

targets:
  c1_model:
    target_name: has_C1_activity
    positive_labels:
      - C1
      - C1/C4
      - mixed
    negative_labels:
      - C4
  c4_model:
    target_name: has_C4_activity
    positive_labels:
      - C4
      - C1/C4
      - mixed
    negative_labels:
      - C1

model_type:
  algorithm: logistic_regression
  penalty: l2
  class_weight: balanced
  fit_intercept: true
  solver: liblinear_or_lbfgs
  regularization_selection: inner_cv_or_predeclared_grid
  preprocessing:
    numeric_imputation: median_fit_on_training_fold_only
    scaling: standardize_fit_on_training_fold_only

evaluation:
  cross_validation:
    type: grouped_5_fold_cv
    group_column: protein_id
    preferred_splitter: StratifiedGroupKFold
    fallback_splitter: GroupKFold
  report:
    - n_positive
    - n_negative
    - PR_AUC
    - balanced_accuracy
    - Recall_at_k
  recall_at_k_rule: >
    k must be fixed before running the analysis. Recommended default: k equals
    the number of positive proteins in the outer test fold.

predictors:
  locked_count: 8
  definitions:
    - predictor_name: occupancy_weighted_C1_minus_C4_plausibility
      source_columns:
        - occupancy_weighted_c1_plausible_fraction
        - occupancy_weighted_c4_plausible_fraction
      condition_formula: >
        occupancy_weighted_c1_plausible_fraction -
        occupancy_weighted_c4_plausible_fraction
      protein_substrate_formula: >
        mean(condition_formula across available dp rows for the same protein_id
        and substrate_class)
      reason: >
        Primary geometry contrast between C1-like and C4-like plausibility.

    - predictor_name: occupancy_weighted_delta_Cu_oxyl_H_angle
      source_columns:
        - occupancy_weighted_Cu_oxyl_H_C1_angle_median
        - occupancy_weighted_Cu_oxyl_H_C4_angle_median
      condition_formula: >
        occupancy_weighted_Cu_oxyl_H_C1_angle_median -
        occupancy_weighted_Cu_oxyl_H_C4_angle_median
      protein_substrate_formula: >
        mean(condition_formula across available dp rows for the same protein_id
        and substrate_class)
      reason: >
        Captures directional/orientational geometry not fully redundant with the
        plausibility fraction.

    - predictor_name: occupancy_weighted_delta_Cu_distance
      source_columns:
        - occupancy_weighted_Cu_C4_distance_median
        - occupancy_weighted_Cu_C1_distance_median
      condition_formula: >
        occupancy_weighted_Cu_C4_distance_median -
        occupancy_weighted_Cu_C1_distance_median
      protein_substrate_formula: >
        mean(condition_formula across available dp rows for the same protein_id
        and substrate_class)
      reason: >
        Captures C1-vs-C4 distance preference in a way that complements attack
        angle and plausibility.

    - predictor_name: hbond_contact_fraction
      source_columns:
        - hbond_contact_fraction
      condition_formula: hbond_contact_fraction
      protein_substrate_formula: >
        mean(hbond_contact_fraction across available dp rows for the same
        protein_id and substrate_class)
      reason: >
        Compact readout of polar contact chemistry likely relevant to productive
        carbohydrate recognition.

    - predictor_name: aromatic_contact_fraction
      source_columns:
        - aromatic_contact_fraction
      condition_formula: aromatic_contact_fraction
      protein_substrate_formula: >
        mean(aromatic_contact_fraction across available dp rows for the same
        protein_id and substrate_class)
      reason: >
        Captures stacking-like contact behavior that often matters for glycan
        engagement.

    - predictor_name: catalytic_surface_contact_fraction
      source_columns:
        - catalytic_surface_contact_fraction
      condition_formula: catalytic_surface_contact_fraction
      protein_substrate_formula: >
        mean(catalytic_surface_contact_fraction across available dp rows for the
        same protein_id and substrate_class)
      reason: >
        Distinguishes catalytic-surface engagement from more peripheral contact
        patterns.

    - predictor_name: contact_eligible_fraction
      source_columns:
        - contact_eligible_fraction
      condition_formula: contact_eligible_fraction
      protein_substrate_formula: >
        mean(contact_eligible_fraction across available dp rows for the same
        protein_id and substrate_class)
      reason: >
        Measures how much of the AF3 ensemble yields interpretable binding-mode
        signal rather than null or weak-contact poses.

    - predictor_name: convergence_fraction
      source_columns:
        - convergence_fraction
      condition_formula: convergence_fraction
      protein_substrate_formula: >
        mean(convergence_fraction across available dp rows for the same
        protein_id and substrate_class)
      reason: >
        Describes internal reproducibility of the predicted ligand placement
        within the ensemble.

excluded_predictors:
  - occupancy_weighted_delta_oxyl_H_median
  - active_site_angle_variation
  explanation:
    - >
      occupancy_weighted_delta_oxyl_H_median was excluded because it overlaps
      substantially with the plausibility signal, which is already derived from
      oxyl-H geometry.
    - >
      active_site_angle_variation was excluded because it is not part of the
      current condition_table contract and would add a more noise-sensitive
      summary under very low effective n.

reporting_and_interpretation:
  primary_claim: >
    Whether AF3-derived summary features contain detectable signal associated
    with experimental C1/C4 specificity.
  non_claims:
    - not a mechanistic proof
    - not a final activity classifier
    - not evidence that negatives are true biochemical negatives
